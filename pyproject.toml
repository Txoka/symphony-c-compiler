[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cymphony"
version = "0.14.4"
description = "A small C compiler targeting the Symphony and Dynphony ISAs from the 'Turing Complete' game"
requires-python = ">=3.10"
dependencies = ["pycparser>=2.21,<3"]

[project.scripts]
scc = "symphony.cli:scc"
dcc = "symphony.cli:dcc"

[tool.setuptools.packages.find]
include = ["symphony*"]

[tool.cibuildwheel]
build = "cp3{10,11,12,13,14,15}-*"
test-sources = ["tests", "selfhost", "examples", "docs"]
test-command = [
    "python -c \"from symphony.emulator import native_available; exit(0 if all(native_available(s) for s in (False, True)) else 1)\"",
    "python -m unittest discover -s tests -v",
    "python -m unittest discover -s selfhost/tests -v",
]

[tool.cibuildwheel.environment]
SYMPHONY_TEST_ISA = "symphony"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64", "universal2"]

[tool.cibuildwheel.windows]
archs = ["AMD64", "x86", "ARM64"]
